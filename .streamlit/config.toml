[theme]
base = "light"
primaryColor = "#0B7285"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EAF6F7"
textColor = "#12344D"
linkColor = "#0B7285"
borderColor = "#D3E4E8"
baseRadius = "0.75rem"
font = "Noto Sans KR:https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap, sans-serif"
greenColor = "#1F7A4D"
orangeColor = "#8A5A00"
redColor = "#B42318"

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
